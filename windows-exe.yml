name: Build NS POS PRO Windows ERP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Windows ERP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'NS_POS_PRO_Windows_ERP_Source_Phone_NOV01.zip' -DestinationPath 'source' -Force

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Check project
        working-directory: source
        run: npm run check

      - name: Build Windows EXE
        working-directory: source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NS_POS_PRO_WINDOWS_EXE
          path: source/dist/*.exe
          if-no-files-found: error
